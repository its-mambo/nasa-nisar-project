<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NISAR image viewer</title>
<style>
  :root { color-scheme: dark; font: 17px system-ui, sans-serif; background: #111821; color: #f1f5f9; }
  body { margin: 0; min-height: 100dvh; display: flex; flex-direction: column; }
  header, footer { display: flex; align-items: center; justify-content: center; gap: .75rem; flex-wrap: wrap; padding: .75rem; }
  h1 { font-size: 1.25rem; margin: 0; }
  main { flex: 1; position:relative; min-height: min(320px, 55dvh); background: #0b1017; }
  canvas { position:absolute; inset:0; display:block; width:100%; height:100%; touch-action:none; cursor:grab; }
  canvas.panning { cursor:grabbing; }
  canvas[hidden], a[hidden] { display: none; }
  button, a { color: inherit; background: #253347; border: 1px solid #62738a; border-radius: .55rem;
    font: inherit; padding: .65rem 1rem; min-height: 48px; min-width: 54px;
    box-sizing: border-box; cursor: pointer; text-decoration: none; }
  button[aria-pressed="true"] { background: #335f92; border-color: #91c2ff; }
  button:focus-visible, a:focus-visible { outline: 3px solid #9cceff; outline-offset: 2px; }
  #message { position:absolute; inset:0; margin:0; padding:1rem; text-align:center; }
  #caption { min-width: 9rem; text-align: center; }
  #zoomHint { margin: 0; color: #cbd5e1; text-align: center; }
</style>
<header>
  <h1>NISAR image viewer</h1>
  <button id="t0" type="button" aria-pressed="false">T0</button>
  <button id="t1" type="button" aria-pressed="false">T1</button>
  <button id="change" type="button" aria-pressed="false">Show change</button>
  <button id="grayscale" type="button" aria-pressed="false">HH grayscale</button>
</header>
<main>
  <p id="message" role="status">Loading image…</p>
  <canvas id="image" role="img" hidden></canvas>
</main>
<footer>
  <button id="prev" type="button" aria-label="Previous image">← Previous</button>
  <span id="caption" aria-live="polite"></span>
  <button id="next" type="button" aria-label="Next image">Next →</button>
  <a id="download" hidden>Download PNG</a>
  <p id="zoomHint">Ctrl + mouse wheel to zoom · Drag to pan</p>
</footer>
<script src="/zoom.js"></script>
<script>
"use strict";
const el = id => document.getElementById(id);
const slides = [
  {id:"t0",title:"T0 — earlier crop"},
  {id:"t1",title:"T1 — later crop"},
  {id:"change",title:"T0 with change overlay"}
];
const revision = new URLSearchParams(location.search).get("v");
let current = 0, request = 0, photo, grayscale = false;
const target = el("image");
const view = new RasterViewport(target, ctx => {
  if (!photo) return;
  const [x,y,X,Y] = view.visible();
  if (X>x && Y>y) ctx.drawImage(photo,x,y,X-x,Y-y,x,y,X-x,Y-y);
});
view.enableDrag(0);
async function show(index) {
  current = (index + slides.length) % slides.length;
  const id = ++request;
  const slide = slides[current], message = el("message");
  slides.forEach((s,i) => el(s.id).setAttribute("aria-pressed",String(i===current)));
  el("grayscale").setAttribute("aria-pressed",String(grayscale));
  el("caption").textContent = `${current+1} / ${slides.length} · ${slide.title}` + (grayscale ? " · HH grayscale" : " · HH/HV colour");
  target.hidden = true; el("download").hidden = true;
  message.hidden = false;
  if (!/^\d+$/.test(revision || "")) {
    message.textContent = "Open the viewer from a completed result in the main window.";
    return;
  }
  message.textContent = "Loading image…";
  const file = slide.id + (grayscale ? "_hh" : "") + ".png", url = "/" + file + "?v=" + revision;
  const image = new Image();
  image.src = url;
  try {
    await image.decode();
    if (id !== request) return;
    photo = image;
    target.setAttribute("aria-label",slide.title + (grayscale ? " in HH grayscale" : " in HH/HV colour"));
    message.hidden = true; target.hidden = false;
    if (view.width !== image.naturalWidth || view.height !== image.naturalHeight) {
      view.setRaster(image.naturalWidth,image.naturalHeight);
    } else {
      view.invalidate();
    }
    el("download").href = url;
    el("download").download = file;
    el("download").hidden = false;
  } catch {
    if (id === request) message.textContent = "Could not load this image. If you ran another selection, open its viewer from the main window.";
  }
}
slides.forEach((s,i) => el(s.id).onclick = () => show(i));
el("grayscale").onclick = () => { grayscale = !grayscale; show(current); };
el("prev").onclick = () => show(current-1);
el("next").onclick = () => show(current+1);
document.addEventListener("keydown",e => {
  if (e.altKey || e.ctrlKey || e.metaKey || !["ArrowLeft","ArrowRight"].includes(e.key)) return;
  e.preventDefault();
  show(current + (e.key === "ArrowLeft" ? -1 : 1));
});
show(0);
</script>
</html>
